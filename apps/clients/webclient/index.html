  <title>Smash!ng Cats</title>

  <link rel="icon" href="/favicon.png" type="image/png" />

  <style>
    #loading {
      position: fixed;
      inset: 0;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;

      background:
        radial-gradient(circle at top, #2d3550 0%, #10131a 60%);

      z-index: 9999;

      font-family: Arial, sans-serif;
    }

    .loading-logo {
      width: min(420px, 80vw);

      image-rendering: auto;

      animation: logo-float 2.2s ease-in-out infinite;
      filter:
        drop-shadow(0 10px 24px rgba(0, 0, 0, 0.45));
    }

    .loading-subtitle {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.08em;

      color: rgba(255, 255, 255, 0.75);

      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes logo-float {
      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-8px);
      }

      100% {
        transform: translateY(0px);
      }
    }

    @keyframes pulse {
      0% {
        opacity: 0.4;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: 0.4;
      }
    }
  </style>
</head>

<body>
  <div id="settings-overlay" class="settings-overlay">
    <select id="engine-select">
      <option value="canvas"><label data-i18n="engine">Engine</label>: Canvas</option>
      <option value="phaser"><label data-i18n="engine">Engine</label>: Phaser</option>
      <option value="three"><label data-i18n="engine">Engine</label>: Three.js</option>
    </select>

    <div class="locale-flags" aria-label="Locale">
      <button class="locale-flag" type="button" data-locale="en" aria-label="English">🇬🇧</button>
      <button class="locale-flag" type="button" data-locale="uk" aria-label="Українська">🇺🇦</button>
    </div>

    <div class="audio-toggles" aria-label="Audio settings">
      <button class="audio-toggle" type="button" id="sound-toggle">
        <span class="audio-icon">🔊</span>
        <span class="audio-cross">❌</span>
      </button>

      <button class="audio-toggle" type="button" id="music-toggle">
        <span class="audio-icon">🎵</span>
        <span class="audio-cross">❌</span>
      </button>
    </div>

    <button id="fullscreen-toggle">⛶</button>
  </div>

  <div id="game-shell">
    <div id="game-root"></div>
    <div id="ui-root"></div>
  </div>

      alt="Smash!ng Cats" />

    <div class="loading-subtitle">
      Loading cats...
    </div>
  </div>

  <script>
    const LOADING_MESSAGES = {
      en: [
        "Loading cats...",
        "Sharpening claws...",
        "Charging smash attack...",
        "Deploying battle cats...",
        "Waking up angry kittens...",
        "Polishing tiny armor...",
        "Summoning Batcat...",
        "Feeding the boss cat...",
        "Stretching cat muscles...",
        "Preparing maximum chaos...",
        "Locating suspicious rats...",
        "Petting cats for luck...",
        "Calibrating meow engines...",
        "Teaching cats to fly...",
        "Spawning tiny destruction...",
        "Loading epic meows...",
        "Checking cactus safety...",
        "Counting smashed enemies...",
        "Syncing cat brains...",
        "Opening tuna reserves...",
      ],

      uk: [
        "Будимо котів...",
        "Точимо кігті...",
        "Заряджаємо smash-атаку...",
        "Випускаємо бойових котів...",
        "Пробуджуємо злих кошенят...",
        "Поліруємо котячу броню...",
        "Викликаємо Беткета...",
        "Годуємо головного кота...",
        "Розминаємо котячі лапи...",
        "Готуємо максимальний хаос...",
        "Шукаємо підозрілих щурів...",
        "Гладимо котів на удачу...",
        "Калібруємо мяв-двигуни...",
        "Вчимо котів літати...",
        "Створюємо маленьке руйнування...",
        "Завантажуємо епічне нявкання...",
        "Перевіряємо безпечність кактусів...",
        "Рахуємо розчавлених ворогів...",
        "Синхронізуємо котячі мізки...",
        "Відкриваємо стратегічний запас тунця...",
      ],
    };

    const MESSAGE_CHANGE_INTERVAL_MS = 4_000;

    const locale = localStorage.getItem("smashing-cats-locale");
    const normalizedLocale = locale === "uk" ? "uk" : "en";

    const loadingSubtitle = document.querySelector(".loading-subtitle");

    function shuffle(array) {
      const result = [...array];

      for (let i = result.length - 1; i > 0; i--) {
        const randomIndex = Math.floor(Math.random() * (i + 1));

        [result[i], result[randomIndex]] = [result[randomIndex], result[i]];
      }

      return result;
    }

    let shuffledMessages = shuffle(LOADING_MESSAGES[normalizedLocale]);
    let currentIndex = 0;

    function updateLoadingMessage() {
      if (currentIndex >= shuffledMessages.length) {
        shuffledMessages = shuffle(LOADING_MESSAGES[normalizedLocale]);
        currentIndex = 0;
      }

      loadingSubtitle.textContent = shuffledMessages[currentIndex];

      currentIndex += 1;
    }

    updateLoadingMessage();

    window.setInterval(() => {
      updateLoadingMessage();
    }, MESSAGE_CHANGE_INTERVAL_MS);

    document.title = normalizedLocale === "uk"
      ? "Руйн!вні Коти"
      : "Smash!ng Cats";

    document.documentElement.lang = normalizedLocale;
  </script>
